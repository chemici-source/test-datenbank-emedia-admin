{% extends "katalog/base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<div class="login-box">
  <h2>Anmelden</h2>
  {% if form.errors %}<p class="fehler">Benutzername oder Passwort stimmen nicht.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Benutzername<input type="text" name="username" autofocus required></label>
    <label>Passwort<input type="password" name="password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Anmelden</button>
  </form>
</div>
{% endblock %}
